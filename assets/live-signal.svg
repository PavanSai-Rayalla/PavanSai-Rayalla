<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-labelledby="title desc">
  <title id="title">Current engineering focus</title>
  <desc id="desc">Animated signal strip highlighting evidence-first AI systems, developer reliability, data platforms, and open source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#07111f"/><stop offset=".5" stop-color="#0b1324"/><stop offset="1" stop-color="#0a0f1b"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
    <filter id="glow" x="-30%" y="-150%" width="160%" height="400%"><feGaussianBlur stdDeviation="4"/></filter>
    <style>
      .pulse{animation:pulse 2.4s ease-in-out infinite;transform-origin:center}.dash{stroke-dasharray:9 15;animation:dash 8s linear infinite}.cursor{animation:blink 1s steps(2,end) infinite}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-240}}@keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect x="1" y="1" width="1198" height="94" rx="24" fill="url(#bg)" stroke="#23324b"/>
  <path d="M46 48 H1154" stroke="#1e293b" stroke-width="1"/>
  <path class="dash" d="M46 48 H1154" stroke="url(#line)" stroke-width="2" opacity=".7"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" fill="#e2e8f0">
    <text x="58" y="34" font-size="13" letter-spacing="2.5" fill="#7dd3fc">NOW BUILDING</text>
    <text x="58" y="66" font-size="21" font-weight="650">evidence-first AI systems  ·  developer reliability  ·  data platforms  ·  open source</text>
    <text class="cursor" x="1138" y="66" font-size="24" fill="#67e8f9">▌</text>
  </g>
  <circle class="pulse" cx="28" cy="48" r="5" fill="#22d3ee"/><circle cx="28" cy="48" r="11" fill="#22d3ee" opacity=".12" filter="url(#glow)"/>
</svg>